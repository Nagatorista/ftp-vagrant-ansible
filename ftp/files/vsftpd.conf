
# Modo independiente IPv4
listen=YES
listen_ipv6=NO

# Acceso exclusivamente autenticado
anonymous_enable=NO
local_enable=YES
write_enable=YES

# Permisos de archivos
local_umask=002
file_open_mode=0666

# Mensajes y registros
dirmessage_enable=YES
use_localtime=YES
log_ftp_protocol=YES
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log
connect_from_port_20=YES

# Enjaulamiento de usuarios
chroot_local_user=YES
chroot_list_enable=YES
chroot_list_file=/etc/vsftpd.chroot_list
allow_writeable_chroot=YES

# Configuración individual de usuarios
user_config_dir=/etc/vsftpd/user_conf

# FTP explícito sobre TLS
ssl_enable=YES
allow_anon_ssl=NO
force_local_logins_ssl=YES
force_local_data_ssl=YES
require_ssl_reuse=NO
ssl_ciphers=HIGH

# Certificado y clave privada
rsa_cert_file=/etc/ssl/certs/vsftpd.crt
rsa_private_key_file=/etc/ssl/private/vsftpd.key

# Rango de puertos pasivos
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
pasv_address=192.168.57.7