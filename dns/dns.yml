---
- name: Configurar el servidor DNS
  hosts: dns
  become: true

  tasks:
    - name: Sincronizar reloj del sistema antes de actualizar APT
      ansible.builtin.shell: timedatectl set-ntp true && sleep 2
      changed_when: false

    - name: Instalar BIND9
      ansible.builtin.apt:
        name: bind9
        state: present
        update_cache: true

    - name: Copiar opciones de BIND
      ansible.builtin.copy:
        src: files/named.conf.options
        dest: /etc/bind/named.conf.options
        owner: root
        group: bind
        mode: "0644"
      notify: Reiniciar BIND

    - name: Copiar configuracion de zonas
      ansible.builtin.copy:
        src: files/named.conf.local
        dest: /etc/bind/named.conf.local
        owner: root
        group: bind
        mode: "0644"
      notify: Reiniciar BIND

    - name: Copiar archivos de zona
      ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "/var/lib/bind/{{ item }}"
        owner: bind
        group: bind
        mode: "0644"
      loop:
        - db.jose.test
        - db.192.168.57
      notify: Reiniciar BIND

    - name: Validar configuracion BIND
      ansible.builtin.command:
        cmd: named-checkconf
      changed_when: false

    - name: Validar zona directa
      ansible.builtin.command:
        argv:
          - named-checkzone
          - jose.test
          - /var/lib/bind/db.jose.test
      changed_when: false

    - name: Validar zona inversa
      ansible.builtin.command:
        argv:
          - named-checkzone
          - 57.168.192.in-addr.arpa
          - /var/lib/bind/db.192.168.57
      changed_when: false

    - name: Iniciar y habilitar BIND
      ansible.builtin.service:
        name: bind9
        enabled: true
        state: started

  handlers:
    - name: Reiniciar BIND
      ansible.builtin.service:
        name: bind9
        state: restarted